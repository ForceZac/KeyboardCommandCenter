<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
    <title>Keyboard Command Center</title>
  </head>
  <body>
    <div id="panel">
      <div id="app-header">
        <span id="app-name"></span>
      </div>
      <div id="view-tabs">
        <button id="tab-app-shortcuts" class="tab active">App Shortcuts</button>
        <button id="tab-my-favorites" class="tab">My Favorites</button>
      </div>
      <div id="search-container">
        <input
          id="search-input"
          type="search"
          placeholder="Search shortcuts…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div id="shortcuts-container"></div>
      <div id="favorites-container" hidden></div>
      <div id="no-results" hidden>No matching shortcuts</div>
      <div id="fallback-container" hidden></div>
    </div>
  </body>
</html>

[package]
name = "kcc-native"
version = "0.1.0"
edition = "2021"

[lib]
# napi-rs requires cdylib to produce a .node binary
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# objc2 provides safe Rust bindings to Objective-C frameworks
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = [
  "NSWorkspace",
  "NSRunningApplication",
] }
objc2-foundation = { version = "0.2", features = [
  "NSString",
  "NSURL",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# windows-rs provides safe bindings to Win32 APIs
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# x11rb: pure-Rust X11 client library (no C libxcb runtime dependency).
# allow-unsafe-code enables zero-copy protocol parsing for performance.
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

[build-dependencies]
napi-build = "2"

[profile.release]
# Strip debug symbols for a smaller binary; LTO for better performance
lto = true
strip = true
